[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaapi"
version = "1.1.0"
description = "Deterministic local-first coding-agent security posture analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
http = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
kaapi = "kaapi.cli:main"
kaapi-api = "kaapi.http_api:main"

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["kaapi"]

[tool.hatch.build]
include = [
  "kaapi/**/*.py",
  "kaapi/data/*.json",
  "kaapi/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
