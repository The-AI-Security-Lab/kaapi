[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaapi"
version = "1.0.0"
description = "Deterministic local-first Claude Code security posture analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
kaapi = "kaapi.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["kaapi"]

[tool.hatch.build]
include = [
  "kaapi/**/*.py",
  "kaapi/data/*.json",
  "kaapi/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
